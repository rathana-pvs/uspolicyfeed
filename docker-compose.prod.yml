services:
  # ── PostgreSQL Database ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uspolicyfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uspolicyfeed123}
      POSTGRES_DB: ${POSTGRES_DB:-uspolicyfeed}
    volumes:
      - uspolicyfeed_db_data:/var/lib/postgresql/data
    networks:
      - internal
    # No ports exposed to host — app talks to db via internal network

  # ── Next.js + Payload CMS App ─────────────────────────────────────
  app:
    image: uspolicyfeed:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER:-uspolicyfeed}:${POSTGRES_PASSWORD:-uspolicyfeed123}@db:5432/${POSTGRES_DB:-uspolicyfeed}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      ENABLE_CLOUDINARY: ${ENABLE_CLOUDINARY:-false}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://uspolicyfeed.com}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-US Policy Feed}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
      NEXT_PUBLIC_WAU_KEY: ${NEXT_PUBLIC_WAU_KEY}
      NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-true}
      NEXT_PUBLIC_ADS_KEEPER_SITE_ID: ${NEXT_PUBLIC_ADS_KEEPER_SITE_ID:-1113195}
      NEXT_PUBLIC_ADS_KEEPER_WIDGET_SIDEBAR: ${NEXT_PUBLIC_ADS_KEEPER_WIDGET_SIDEBAR:-2088217}
      NEXT_PUBLIC_ADS_KEEPER_WIDGET_IN_ARTICLE_1: ${NEXT_PUBLIC_ADS_KEEPER_WIDGET_IN_ARTICLE_1:-2088215}
      NEXT_PUBLIC_ADS_KEEPER_WIDGET_IN_ARTICLE_2: ${NEXT_PUBLIC_ADS_KEEPER_WIDGET_IN_ARTICLE_2}
      NEXT_PUBLIC_ADS_KEEPER_WIDGET_UNDER_ARTICLE: ${NEXT_PUBLIC_ADS_KEEPER_WIDGET_UNDER_ARTICLE}
      NEXT_PUBLIC_ADS_KEEPER_WIDGET_FEED: ${NEXT_PUBLIC_ADS_KEEPER_WIDGET_FEED:-2088213}
    volumes:
      - uspolicyfeed_media_data:/app/public/media
    networks:
      - internal
      - web

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - uspolicyfeed_media_data:/var/www/media:ro
    depends_on:
      - app
    networks:
      - web

  # ── Certbot (Let's Encrypt SSL) ───────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run manually: docker compose run --rm certbot certonly ...
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'

networks:
  internal:
    driver: bridge
  web:
    driver: bridge

volumes:
  uspolicyfeed_db_data:
  uspolicyfeed_media_data:
  certbot_www:
  certbot_certs:
